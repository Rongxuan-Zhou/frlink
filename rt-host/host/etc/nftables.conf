#!/usr/sbin/nft -f
# Franka RT host firewall (alienware). Loaded by nftables.service and `systemctl reload nftables`.
# Deliberately NO `flush ruleset`: Docker's iptables-nft tables (ip filter/nat, DOCKER-USER) must survive reloads.
# udp 50001 (servo command port) is only ever reachable via frlink0 (and lo for local tests): the
# first input rule drops it from every other interface before the per-interface rules below run.
define FCI_IF  = "enp110s0"     # robot NIC -> FR3 control cabinet
define LINK_IF = "frlink0"      # USB 2.5GbE dongle -> unmanaged switch -> rog eno1
define ROBOT   = 172.16.0.2
define LINKNET = 10.10.0.0/24

table inet franka {}
flush table inet franka
table inet franka {
    set cmd_allow {                     # hosts allowed to send servo commands (udp 50001); rog first
        type ipv4_addr
        elements = { 10.10.0.1 }
    }
    chain input {
        type filter hook input priority filter - 10; policy accept;
        iifname != { "lo", $LINK_IF } udp dport 50001 counter drop
        iifname $FCI_IF ip saddr $ROBOT accept
        iifname $FCI_IF counter drop
        iifname $LINK_IF ct state established,related accept
        iifname $LINK_IF ip saddr $LINKNET icmp type { echo-request, echo-reply } accept
        iifname $LINK_IF ip saddr $LINKNET tcp dport 22 accept
        iifname $LINK_IF ip saddr @cmd_allow udp dport 50001 accept
        iifname $LINK_IF counter drop
    }
    chain forward {
        type filter hook forward priority filter - 10; policy accept;
        iifname { $FCI_IF, $LINK_IF } counter drop
        oifname { $FCI_IF, $LINK_IF } counter drop
    }
    chain output {
        type filter hook output priority filter - 10; policy accept;
        oifname $FCI_IF ip daddr $ROBOT accept
        oifname $FCI_IF counter drop
        oifname $LINK_IF ip daddr $LINKNET accept
        oifname $LINK_IF counter drop
    }
}
